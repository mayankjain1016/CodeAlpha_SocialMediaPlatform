<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Not Found (404) / Sangam</title>
  <meta name="description" content="The stream you are seeking has flowed elsewhere on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-6); background: var(--bg-main);">
  <div class="empty-state-card" style="max-width: 520px; width: 100%; padding: var(--space-8) var(--space-6);">
    <!-- Confluence Brand Mark -->
    <a href="/" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: var(--space-6); text-decoration: none;">
      <svg viewBox="0 0 32 32" fill="none" width="38" height="38">
        <rect width="32" height="32" rx="10" fill="#14110F"/>
        <circle cx="12" cy="16" r="6.75" stroke="#0E7C86" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="20" cy="16" r="6.75" stroke="#FFA41B" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M12 11.5C14.2 13.8 17.8 13.8 20 11.5M12 20.5C14.2 18.2 17.8 18.2 20 20.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
        <circle cx="16" cy="16" r="2" fill="#FFA41B"/>
      </svg>
      <span style="font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Sangam</span>
    </a>

    <!-- Custom Confluence River 404 Illustration -->
    <div style="width: 180px; height: 140px; margin-bottom: var(--space-4);">
      <svg viewBox="0 0 180 140" fill="none" width="100%" height="100%">
        <!-- River stream 1: Teal -->
        <path d="M20 30 C 50 30, 70 70, 90 70 C 120 70, 140 110, 170 110" stroke="var(--teal-500)" stroke-width="4.5" stroke-linecap="round"/>
        <!-- River stream 2: Marigold -->
        <path d="M20 110 C 50 110, 70 70, 90 70 C 120 70, 140 30, 170 30" stroke="var(--marigold-400)" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Confluence Point Glow -->
        <circle cx="90" cy="70" r="16" fill="rgba(14, 124, 134, 0.15)"/>
        <circle cx="90" cy="70" r="8" fill="var(--marigold-400)"/>
        <!-- Floating milestone badge -->
        <rect x="70" y="16" width="40" height="24" rx="8" fill="var(--bg-surface)" stroke="var(--hairline-strong)"/>
        <text x="90" y="32" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="11" fill="var(--text-main)" text-anchor="middle">404</text>
      </svg>
    </div>

    <h1 style="font-family: var(--font-display); font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 800; margin: 0 0 8px 0; color: var(--text-main);">
      Stream Not Found
    </h1>
    <p style="color: var(--text-secondary); margin: 0 0 var(--space-6) 0; font-size: 0.95rem; line-height: 1.5; max-width: 400px;">
      The channel you were seeking has flowed elsewhere or diverged. Return to the main stream to discover live conversations.
    </p>

    <div style="display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center;">
      <a href="/" class="btn btn-primary btn-md">Return Home</a>
      <a href="/explore" class="btn btn-secondary btn-md">Explore Streams</a>
    </div>
  </div>
</body>
</html>
