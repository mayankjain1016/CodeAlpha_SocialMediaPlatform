<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found / Sangam</title>
  <meta name="description" content="The page you are looking for does not exist on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; background-color: var(--bg-app);">
  <div style="max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;">
    <a href="/" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: var(--space-8); text-decoration: none;">
      <svg viewBox="0 0 32 32" fill="none" width="40" height="40">
        <rect width="32" height="32" rx="9" fill="#0B0F14"/>
        <circle cx="12" cy="16" r="6.5" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="20" cy="16" r="6.5" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="1.75" fill="#60A5FA"/>
      </svg>
      <span style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Sangam</span>
    </a>

    <div style="font-size: 5rem; font-weight: 800; font-family: var(--font-heading); line-height: 1; margin-bottom: 8px; background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      404
    </div>

    <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-3); color: var(--text-main);">Stream not found</h1>
    <p style="color: var(--text-secondary); margin-bottom: var(--space-6); font-size: 0.95rem; line-height: 1.5;">
      The page or profile you’re looking for has moved, dried up, or never existed in this river of thoughts.
    </p>

    <div style="display: flex; gap: 12px;">
      <a href="/" class="btn btn-primary btn-lg">Back to Home</a>
      <a href="/explore" class="btn btn-secondary btn-lg">Explore Topics</a>
    </div>
  </div>
</body>
</html>
