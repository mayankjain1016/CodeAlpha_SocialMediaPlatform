<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account &mdash; Sangam</title>
  <meta name="description" content="Join Sangam &mdash; Share stories, join conversations, and connect with creators.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Topbar Header (Minimal) -->
  <header class="app-topbar"></header>

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon-wrap" style="width: 44px; height: 44px; margin-bottom: 4px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="8" cy="12" r="5" stroke="#FFFFFF" stroke-width="2" />
            <circle cx="16" cy="12" r="5" stroke="#FFFFFF" stroke-width="2" />
            <path d="M8 8C9.5 10 14.5 10 16 8M8 16C9.5 14 14.5 14 16 16" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="auth-title">Join Sangam</h1>
        <p class="auth-subtitle">Create your account to share stories and connect.</p>
      </div>

      <!-- Registration Form -->
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Mayank Sharma" required maxlength="50" autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. mayank" required maxlength="30" autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password" />
        </div>

        <button type="submit" class="btn btn-gradient btn-lg" id="register-submit-btn" style="width: 100%; margin-top: 8px;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; font-size: var(--text-xs); color: var(--text-secondary); margin-top: 8px;">
        Already have an account? <a href="/login" style="color: var(--primary); font-weight: 700; text-decoration: none;">Log in</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
