<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation &mdash; Sangam</title>
  <meta name="description" content="View post details and discussion thread on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Topbar Header -->
  <header class="app-topbar"></header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Left Navigation Rail -->
    <aside class="left-rail"></aside>

    <!-- Center Content -->
    <main class="center-feed" id="main-content">
      <!-- Back Navigation Bar -->
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px;">
        <button type="button" class="btn-icon" id="post-back-btn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
          </svg>
        </button>
        <span style="font-weight: 800; font-size: var(--text-base); color: var(--text-main);">Conversation</span>
      </div>

      <!-- Single Post Container -->
      <div id="single-post-mount"></div>

      <!-- Comments Section -->
      <div class="widget-card" style="margin-top: var(--sp-4);">
        <div class="widget-title">
          <span>Comments</span>
          <span id="comments-count-pill" style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 500;"></span>
        </div>

        <!-- Add Comment Input Box -->
        <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border-hairline);">
          <div id="comment-user-avatar"></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
            <textarea id="post-detail-comment-input" class="form-textarea" placeholder="Write a comment..." rows="2" style="min-height: 54px;"></textarea>
            <div style="display: flex; justify-content: flex-end;">
              <button type="button" class="btn btn-primary btn-sm" id="post-detail-comment-submit" disabled>Comment</button>
            </div>
          </div>
        </div>

        <!-- Comments List Container -->
        <div id="comments-list-mount" style="display: flex; flex-direction: column; gap: var(--sp-3); padding-top: 12px;"></div>
      </div>
    </main>

    <!-- Right Rail -->
    <aside class="right-rail"></aside>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="bottom-navbar"></nav>

  <!-- Page JS Script -->
  <script type="module" src="/js/pages/post.js"></script>
</body>
</html>
