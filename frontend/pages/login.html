<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In &mdash; Sangam</title>
  <meta name="description" content="Log in to your Sangam account to connect, react, and share stories.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Topbar Header (Minimal) -->
  <header class="app-topbar"></header>

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon-wrap" style="width: 44px; height: 44px; margin-bottom: 4px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="8" cy="12" r="5" stroke="#FFFFFF" stroke-width="2" />
            <circle cx="16" cy="12" r="5" stroke="#FFFFFF" stroke-width="2" />
            <path d="M8 8C9.5 10 14.5 10 16 8M8 16C9.5 14 14.5 14 16 16" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to your Sangam account to see what's happening.</p>
      </div>

      <!-- Quick Demo Credentials Fill -->
      <div class="demo-credentials-chip" id="demo-fill-chip" title="Click to auto-fill demo account">
        <div>
          <span style="font-weight: 700; color: var(--primary);">Quick Demo Login</span>
          <div style="color: var(--text-muted); font-size: 11px;">demo@sangam.in &middot; Demo@123</div>
        </div>
        <span style="font-weight: 700; color: var(--primary);">Auto Fill &rarr;</span>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email or Username</label>
          <input type="text" id="login-email" class="form-input" placeholder="you@example.com or username" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-gradient btn-lg" id="login-submit-btn" style="width: 100%; margin-top: 8px;">
          Log In
        </button>
      </form>

      <div style="text-align: center; font-size: var(--text-xs); color: var(--text-secondary); margin-top: 8px;">
        Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 700; text-decoration: none;">Join Sangam</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
