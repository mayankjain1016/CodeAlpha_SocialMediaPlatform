<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore / Sangam</title>
  <meta name="description" content="Discover what is trending across technology, culture, and startups on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <div class="shell-container">
      <nav class="shell-nav" aria-label="Main Navigation"></nav>

      <main class="shell-center" id="main-content">
        <header class="mobile-top-bar"></header>

        <header class="sticky-header">
          <div class="header-title-wrap">
            <h1 class="header-title">Explore</h1>
          </div>
        </header>

        <!-- Search Bar within Explore page for mobile & fast access -->
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);">
          <div class="search-input-wrap">
            <span class="search-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="explore-search-input" class="search-input" placeholder="Search people & tags..." autocomplete="off">
          </div>
          <div id="explore-people-results" style="display: none; margin-top: 10px; background: var(--bg-surface-subtle); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-subtle);"></div>
        </div>

        <!-- Trending tags strip -->
        <section style="padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); background-color: var(--bg-surface-subtle);">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <span style="font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Trending Topics</span>
            <div id="active-tag-chip" style="display: none; align-items: center; gap: 6px; background: var(--primary-light); color: var(--primary); padding: 2px 10px; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600;">
              <span id="chip-tag-name"></span>
              <button id="clear-tag-btn" style="color: var(--primary); display: flex;" aria-label="Clear filter">&times;</button>
            </div>
          </div>
          <div id="trending-strip" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;">
            <!-- Rendered by JS -->
          </div>
        </section>

        <!-- Explore Posts Stream -->
        <section id="explore-posts-stream" aria-label="Explore posts"></section>

        <div id="explore-sentinel" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
          <span class="btn-spinner" style="display: inline-block; border-color: var(--border-medium); border-top-color: var(--primary);"></span>
        </div>
      </main>

      <aside class="shell-sidebar" aria-label="Sidebar Widgets"></aside>
    </div>
  </div>

  <nav class="mobile-bottom-bar" aria-label="Mobile Navigation"></nav>

  <script type="module" src="/js/pages/explore.js"></script>
</body>
</html>
