<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore &mdash; Discover Visuals & Ideas on Sangam</title>
  <meta name="description" content="Discover photos, creative ideas, and trending topics across the Sangam community in a Pinterest-style masonry grid.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Topbar Header -->
  <header class="app-topbar"></header>

  <!-- App Layout Grid -->
  <div class="app-layout">
    <!-- Left Navigation Rail -->
    <aside class="left-rail"></aside>

    <!-- Center Content (Wide for Masonry) -->
    <main class="center-feed wide" id="main-content">
      <!-- Explore Header -->
      <div style="margin-bottom: var(--sp-2);">
        <h1 style="font-family: var(--font-heading); font-size: var(--text-2xl); font-weight: 800; color: var(--text-main); margin-bottom: 4px;">
          Explore
        </h1>
        <p style="font-size: var(--text-sm); color: var(--text-secondary); margin: 0 0 16px 0;">
          Discover photos, stories, and ideas curated by the community.
        </p>

        <!-- Topic Chips Filter -->
        <div id="explore-topics-mount"></div>
      </div>

      <!-- Pinterest-style Masonry Grid -->
      <section class="explore-masonry-grid" id="explore-masonry-container" aria-label="Explore Visuals"></section>

      <!-- Loading / End Sentinel -->
      <div id="explore-loading" style="text-align: center; padding: 32px; color: var(--text-muted); font-size: var(--text-xs);">
        Discovering more ideas...
      </div>
    </main>

    <!-- Right Rail -->
    <aside class="right-rail"></aside>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="bottom-navbar"></nav>

  <!-- Page JS Script -->
  <script type="module" src="/js/pages/explore.js"></script>
</body>
</html>
