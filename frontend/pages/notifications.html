<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity & Notifications / Sangam</title>
  <meta name="description" content="View your latest interactions, likes, comments, and follower updates on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Top Floating Pill Navbar -->
  <header class="top-navbar" aria-label="Main Navigation"></header>

  <!-- Page Layout Container -->
  <div class="page-container">
    <div class="bento-grid">
      <!-- Left Column Shortcuts -->
      <aside class="col-left"></aside>

      <!-- Center Focused Column -->
      <main class="col-center" style="grid-column: span 6;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
          <div>
            <h1 style="font-family: var(--font-display); font-size: clamp(1.6rem, 2.8vw, 2.2rem); font-weight: 800; margin: 0 0 4px 0;">
              Activity Stream
            </h1>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin: 0;">Interactions, replies, and connections.</p>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="mark-all-read-btn">
            Mark all read
          </button>
        </div>

        <section id="notif-stream" aria-label="Notifications stream"></section>
      </main>

      <!-- Right Column Bento Widgets -->
      <aside class="col-right"></aside>
    </div>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation"></nav>

  <!-- Page JS Script -->
  <script type="module" src="/js/pages/notifications.js"></script>
</body>
</html>
