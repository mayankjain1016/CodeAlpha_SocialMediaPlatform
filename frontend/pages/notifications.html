<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications &mdash; Sangam</title>
  <meta name="description" content="View interactions, reactions, comments, and follower updates on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Topbar Header -->
  <header class="app-topbar"></header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Left Navigation Rail -->
    <aside class="left-rail"></aside>

    <!-- Center Feed -->
    <main class="center-feed" id="main-content">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3);">
        <h1 style="font-family: var(--font-heading); font-size: var(--text-xl); font-weight: 800; color: var(--text-main); margin: 0;">
          Notifications
        </h1>
        <button type="button" class="btn btn-secondary btn-sm" id="mark-all-read-btn">
          Mark all as read
        </button>
      </div>

      <!-- Notifications Panel -->
      <section class="notifications-panel" id="notif-stream" aria-label="Notifications List"></section>
    </main>

    <!-- Right Rail -->
    <aside class="right-rail"></aside>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="bottom-navbar"></nav>

  <!-- Page JS Script -->
  <script type="module" src="/js/pages/notifications.js"></script>
</body>
</html>
