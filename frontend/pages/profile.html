<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Profile / Sangam</title>
  <meta name="description" content="View user profile, generative identity, stories, media, and connections on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Top Floating Pill Navbar -->
  <header class="top-navbar" aria-label="Main Navigation"></header>

  <!-- Page Layout Container -->
  <div class="page-container">
    <div class="bento-grid">
      <!-- Left Column Shortcuts -->
      <aside class="col-left"></aside>

      <!-- Center Column Profile Content -->
      <main class="col-center" style="grid-column: span 6;">
        <!-- Bento Profile Header Card (with 3D Pointer Tilt) -->
        <div id="profile-hero-mount">
          <!-- Rendered by JS -->
        </div>

        <!-- Sliding Profile Tabs (Posts, Media) -->
        <div class="sliding-tabs-bar" role="tablist">
          <button class="sliding-tab-item active" id="tab-user-posts" role="tab" aria-selected="true">Conversations</button>
          <button class="sliding-tab-item" id="tab-user-media" role="tab" aria-selected="false">Media & Visuals</button>
          <div class="sliding-tab-active-bar" id="profile-tab-indicator"></div>
        </div>

        <!-- User Posts Stream / Media Grid Mount -->
        <section id="user-posts-stream" aria-label="User posts stream"></section>

        <!-- Sentinel -->
        <div id="profile-sentinel" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
          <span class="btn-spinner" style="display: inline-block;"></span>
        </div>
      </main>

      <!-- Right Column Bento Widgets -->
      <aside class="col-right"></aside>
    </div>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation"></nav>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
      <div class="modal-header">
        <h3 id="edit-profile-title" class="modal-title">Edit Profile</h3>
        <button class="btn-icon modal-close-btn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="edit-profile-form">
        <div class="modal-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
          <div>
            <label class="form-label" for="edit-name" style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">Display Name</label>
            <input type="text" id="edit-name" class="form-input" maxlength="50" required style="width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--hairline-strong); background: var(--bg-surface-2); color: var(--text-main);">
          </div>
          <div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <label class="form-label" for="edit-bio" style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted);">Bio</label>
              <span style="font-size: 0.72rem; color: var(--text-muted);" id="edit-bio-count">0/160</span>
            </div>
            <textarea id="edit-bio" class="form-input" maxlength="160" rows="3" style="width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--hairline-strong); background: var(--bg-surface-2); color: var(--text-main); resize: none;"></textarea>
          </div>

          <div>
            <label class="form-label" style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">Confluence Banner Preset</label>
            <div id="banner-preset-picker" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
              <!-- 8 presets generated by JS -->
            </div>
          </div>
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--hairline);">
          <button type="button" class="btn btn-secondary modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Followers / Following List Modal -->
  <div class="modal-overlay" id="user-list-modal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="user-list-title">
      <div class="modal-header">
        <h3 id="user-list-title" class="modal-title">Community</h3>
        <button class="btn-icon modal-close-btn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="user-list-mount" style="padding: 0; max-height: 60vh; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- Page JS Script -->
  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
