<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile / Sangam</title>
  <meta name="description" content="View user profile, posts, media and follower community on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <div class="shell-container">
      <nav class="shell-nav" aria-label="Main Navigation"></nav>

      <main class="shell-center" id="main-content">
        <header class="mobile-top-bar"></header>

        <!-- Sticky Header with Back Button and Profile Name -->
        <header class="sticky-header">
          <div class="header-title-wrap">
            <button class="header-back-btn" id="profile-back-btn" aria-label="Go back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="20" height="20"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            </button>
            <div>
              <h1 class="header-title" id="header-profile-name" style="line-height: 1.1;">Profile</h1>
              <span id="header-profile-postscount" style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">0 posts</span>
            </div>
          </div>
        </header>

        <!-- Profile Hero Section -->
        <div id="profile-hero">
          <!-- Rendered by JS: Banner, Avatar ring, Action btn, Bio, Counts -->
        </div>

        <!-- Profile Tabs (Posts, Media) -->
        <div class="tabs-nav" role="tablist">
          <button class="tab-btn active" id="tab-user-posts" role="tab" aria-selected="true">Posts</button>
          <button class="tab-btn" id="tab-user-media" role="tab" aria-selected="false">Media</button>
          <div class="tab-indicator" id="profile-tab-indicator"></div>
        </div>

        <!-- User Posts Stream -->
        <section id="user-posts-stream" aria-label="User posts"></section>

        <div id="profile-sentinel" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
          <span class="btn-spinner" style="display: inline-block; border-color: var(--border-medium); border-top-color: var(--primary);"></span>
        </div>
      </main>

      <aside class="shell-sidebar" aria-label="Sidebar Widgets"></aside>
    </div>
  </div>

  <nav class="mobile-bottom-bar" aria-label="Mobile Navigation"></nav>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
      <div class="modal-header">
        <h3 id="edit-profile-title" class="modal-title">Edit profile</h3>
        <button class="btn-icon modal-close-btn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="20" height="20"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="edit-profile-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="edit-name">Display Name</label>
            <input type="text" id="edit-name" class="form-input" maxlength="50" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-bio">Bio</label>
            <textarea id="edit-bio" class="form-input" maxlength="160" rows="3" style="resize: none;"></textarea>
            <span style="font-size: 0.72rem; color: var(--text-muted); float: right;" id="edit-bio-count">0/160</span>
          </div>

          <div class="form-group" style="clear: both;">
            <label class="form-label">Banner Style (Choose Preset)</label>
            <div id="banner-preset-picker" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px;">
              <!-- 8 presets generated by JS -->
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Followers / Following List Modal -->
  <div class="modal-overlay" id="user-list-modal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="user-list-title">
      <div class="modal-header">
        <h3 id="user-list-title" class="modal-title">Followers</h3>
        <button class="btn-icon modal-close-btn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="20" height="20"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="user-list-mount" style="padding: 0; max-height: 60vh; overflow-y: auto;">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
