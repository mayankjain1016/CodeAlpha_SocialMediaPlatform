<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile &mdash; Sangam</title>
  <meta name="description" content="Explore creator profile, stories, photo grid, and conversations on Sangam.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Topbar Header -->
  <header class="app-topbar"></header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Left Navigation Rail -->
    <aside class="left-rail"></aside>

    <!-- Center Content -->
    <main class="center-feed wide" id="main-content">
      <!-- Profile Header Hero Card (Instagram Style) -->
      <section id="profile-hero-mount"></section>

      <!-- Instagram Tabs: Posts (List) / Grid (Photos) / Saved -->
      <div class="profile-tabs-strip" role="tablist">
        <button class="profile-tab-item active" id="tab-grid" role="tab" aria-selected="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Photos</span>
        </button>
        <button class="profile-tab-item" id="tab-feed" role="tab" aria-selected="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>Feed</span>
        </button>
      </div>

      <!-- Photos 3-Column Square Grid -->
      <div class="profile-photo-grid" id="profile-photo-grid" style="display: grid;"></div>

      <!-- Feed Stream (Posts List) -->
      <div id="profile-feed-stream" style="display: none; flex-direction: column; gap: var(--sp-4);"></div>

      <!-- Sentinel / Status -->
      <div id="profile-loading" style="text-align: center; padding: 24px; color: var(--text-muted); font-size: var(--text-xs);">
        Loading profile content...
      </div>
    </main>

    <!-- Right Rail -->
    <aside class="right-rail"></aside>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="bottom-navbar"></nav>

  <!-- Edit Profile Modal Dialog -->
  <div class="modal-backdrop" id="edit-profile-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile</h3>
        <button type="button" class="btn-icon" id="close-edit-modal">&times;</button>
      </div>
      <form id="edit-profile-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="edit-name">Display Name</label>
            <input type="text" id="edit-name" class="form-input" required maxlength="50" />
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-bio">Bio</label>
            <textarea id="edit-bio" class="form-textarea" maxlength="160" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-edit-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Page JS Script -->
  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
