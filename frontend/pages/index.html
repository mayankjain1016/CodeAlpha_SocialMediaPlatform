<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home / Sangam</title>
  <meta name="description" content="Sangam is a modern social platform for thinkers, builders, and storytellers. Connect, share ideas, and explore trending topics.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts Preconnect & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <!-- Avoid Theme Flash Script -->
  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <div class="shell-container">
      <!-- Left Nav -->
      <nav class="shell-nav" aria-label="Main Navigation"></nav>

      <!-- Center Feed -->
      <main class="shell-center" id="main-content">
        <!-- Mobile Top Bar -->
        <header class="mobile-top-bar"></header>

        <!-- Sticky Header with Tabs -->
        <header class="sticky-header">
          <div class="header-title-wrap">
            <h1 class="header-title">Home</h1>
          </div>
        </header>

        <!-- Feed Tabs (Following / Explore) -->
        <div class="tabs-nav" role="tablist">
          <button class="tab-btn active" id="tab-following" role="tab" aria-selected="true">Following</button>
          <button class="tab-btn" id="tab-explore" role="tab" aria-selected="false">Explore</button>
          <div class="tab-indicator" id="feed-tab-indicator"></div>
        </div>

        <!-- Inline Post Composer -->
        <section id="composer-mount" aria-label="Create Post"></section>

        <!-- Post Stream -->
        <section id="posts-stream" aria-label="Post stream">
          <!-- Skeletons initially rendered -->
        </section>

        <!-- Infinite Scroll Sentinel -->
        <div id="feed-sentinel" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
          <span class="btn-spinner" style="display: inline-block; border-color: var(--border-medium); border-top-color: var(--primary);"></span>
        </div>
      </main>

      <!-- Right Sidebar -->
      <aside class="shell-sidebar" aria-label="Sidebar Widgets"></aside>
    </div>
  </div>

  <!-- Mobile Bottom Bar -->
  <nav class="mobile-bottom-bar" aria-label="Mobile Navigation"></nav>

  <!-- Page Logic ES Module -->
  <script type="module" src="/js/pages/feed.js"></script>
</body>
</html>
