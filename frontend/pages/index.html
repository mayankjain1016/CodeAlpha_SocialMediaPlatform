<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangam &mdash; Where conversations meet</title>
  <meta name="description" content="Sangam is an editorial-meets-social platform for thinkers, builders, and storytellers. Connect, share ideas, and explore trending streams.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <!-- Google Fonts Preconnect & Bricolage Grotesque + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <!-- Avoid Theme Flash Script -->
  <script>
    (function() {
      const theme = localStorage.getItem('sangam_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Floating Glass Pill Top Navbar -->
  <header class="top-navbar" aria-label="Main Navigation"></header>

  <!-- Page Content Container -->
  <div class="page-container" id="feed-page-root">
    <!-- Dynamic Content mounted by feed.js (Guest Landing or Bento Home Feed) -->
  </div>

  <!-- Mobile Floating Pill Bottom Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation"></nav>

  <!-- Page Logic ES Module -->
  <script type="module" src="/js/pages/feed.js"></script>
</body>
</html>
