<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="sangam-glow" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sangam-accent" x1="16" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Background curved squircle -->
  <rect width="32" height="32" rx="9" fill="#0B0F14"/>
  <!-- Two confluence circles meeting with 1.75px stroke style and flowing curves -->
  <circle cx="12" cy="16" r="6.5" stroke="url(#sangam-glow)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="16" r="6.5" stroke="url(#sangam-accent)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M12 11.5C14.5 13.5 17.5 13.5 20 11.5M12 20.5C14.5 18.5 17.5 18.5 20 20.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <!-- Central meeting nexus -->
  <circle cx="16" cy="16" r="1.75" fill="#60A5FA"/>
</svg>
