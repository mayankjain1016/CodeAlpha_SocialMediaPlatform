<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Confluence River Teal & Sun Marigold Gradients -->
    <linearGradient id="sangam-teal" x1="4" y1="4" x2="20" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#149AA6"/>
      <stop offset="100%" stop-color="#0E7C86"/>
    </linearGradient>
    <linearGradient id="sangam-marigold" x1="12" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC043"/>
      <stop offset="100%" stop-color="#FFA41B"/>
    </linearGradient>
  </defs>

  <!-- Dark ink curved pill background -->
  <rect width="32" height="32" rx="10" fill="#14110F"/>

  <!-- River confluence: Two overlapping flowing organic circles -->
  <!-- Left Ring: Teal -->
  <circle cx="12" cy="16" r="6.75" stroke="url(#sangam-teal)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right Ring: Marigold -->
  <circle cx="20" cy="16" r="6.75" stroke="url(#sangam-marigold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Meeting Confluence Waves in the overlapping lens -->
  <path d="M12 11.5C14.2 13.8 17.8 13.8 20 11.5M12 20.5C14.2 18.2 17.8 18.2 20 20.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>

  <!-- Confluence nexus jewel -->
  <circle cx="16" cy="16" r="2" fill="#FFA41B"/>
</svg>
